<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors | Class selector</title>
    <style>
        .Style1{
            font-size: 28px;
            background-color: lightseagreen;
            color: coral;
        }
        .Style2{
            color: rebeccapurple;
        }
        .Style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: crimson;
        }
    </style>
</head>
<body>
    <h1 class="Style1">Class selector</h1>
    <h1 class="Style2">Heading tag itself; but a different style.</h1>
    <p class="Style3">This is a New paragraph that I've created.</p>
    <p class="Style2">This is the second paragragh.</p>
</body>
</html>
