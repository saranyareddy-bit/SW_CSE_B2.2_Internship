<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML TABLES 3</title>
</head>
<body>
    <h4>colspan</h4>
    <table border="2">
        <tr>
            <th colspan="3">Students Details</th>
        </tr>
        <tr>
            <td colspan="2">Name</td>
            <td>Saranya.m</td>
        </tr>
        <tr>
            <td>Courses</td>
            <td>Full Stack</td>
            <td>Gen AI</td>
        </tr>
    </table>
    <!-- row span-->
     <h4>rowspan</h4>
     <table border="2">
        <tr>
            <th rowspan="2">Day</th>
            <th>Morning</th>
            <th>Evening</th>
        </tr>
        <tr>
            <td>React JS</td>
            <td>Backend practice</td>
        </tr>
     </table>
</body>
</html>
