<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="/SW_CSE_B2.2_Internship/day/Videos/mp4videoWaudio.mp4.mp4" controls type="video/mp4"></video>
   <!-- width and height-->
    <video src="/SW_CSE_B2.2_Internship/day/Videos/mp4videoWaudio.mp4.mp4" controls type="video/mp4" width="640" height="360"></video>
    <!-- auto play -->
      <video src="/SW_CSE_B2.2_Internship/day/Videos/mp4videoWaudio.mp4.mp4" controls type="video/mp4" autoplay></video>
      <!-- loops -->
     <video src="/SW_CSE_B2.2_Internship/day/Videos/mp4videoWaudio.mp4.mp4" controls loop autoplay width="640" height="360"></video>
    <!-- poster -->
      <video src="/SW_CSE_B2.2_Internship/day/Videos/mp4videoWaudio.mp4.mp4" controls type="video/mp4" poster="/SW_CSE_B2.2_Internship/day/Images/cat.jpg"></video>
</body>
</html>
