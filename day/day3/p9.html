<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio tag</title>
</head>
<body>
    <p>Audio Tag example</p>
    <audio src="audio_sample.mp3.mp3" controls type="audio/mpeg"></audio>
    <p>2</p>
    <audio src="audio_sample.mp3.mp3" controls type="audio/mpeg" autoplay></audio>
    <p>3</p>
    <audio src="audio_sample.mp3.mp3" controls type="audio/mpeg" autoplay muted loop></audio>
</body>
</html>
