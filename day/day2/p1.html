<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag</title>
</head>
<body>
    <!-- Image tag: -->
    <img src="cat_image.jpg" alt="The image of a cat">
    <!-- arc: source | alt: alternative -->
     <!-- Image type: jpg/jpeg | png | webp | gif -->
    <img src="cat_image.jpg" alt="The image of a cat" width="350px" height="900px">
    <img src="cat_image.jpg" alt="The image of a cat" title="My name is Mochi.">
    <img src="https://headsupfortails.com/cdn/shop/articles/Welcoming_a_Cat_to_a_New_Home_x630.jpg?v=1741258295" remote="Image does not exist">
</body>
</html>
