<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>
    <style>
        .named{
            color: orchid;
        }
        .hex{
            color: #ff0099;
        }
        .rgb{
            color: rgb(128,60,196,1);
        }
        .hsl{
            color: hsla(128,100%,50%,0.6);
        }
        .gradient{
            background-image: linear-gradient(135deg,pink,lightblue);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display:inline-block;
        }
    </style>
</head>
<body>
    <p>CSS Colors</p>
    <ol>
        <li class="named">Named colors</li>
        <li class="hex">HEX colors</li>
        <li class="rgb">RGB & RGBA</li>
        <li class="hsl">HSL & HSLA</li>
        <li class="gradient">Gradient color</li>
    </ol>
</body>
</html>
