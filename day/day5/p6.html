<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox | Display</title>
    <style>
        .container{
            display: flex;
            border: 2px solid hotpink;
            gap: 10px;
            padding: 10px;
            flex-direction: column;
        }
        .item{
            background-color: aquamarine;
            color: coral;
            padding: 15px;
            text-align: start;
        }
        .container2{
            display: flex;
            border: 2px solid lightslategrey;
            gap: 10px;
            padding: 10px;
            flex-direction: column-reverse;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p>CSS Flexbox:is a one-dimensional layout system designed to arrange and align items in a container, either in a row or column.It makes much easier to create responsive, flexible layouts without complex positioning or floats.</p>
     <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <div class="container2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
</body>
</html>
